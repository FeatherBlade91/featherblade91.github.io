<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>相册审阅 · LYK ♥ DMY</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="review-page">
  <main class="reviewer" id="listCard">
    <header class="review-topbar">
      <a class="review-brand" href="index.html" title="返回相册">
        <span>FOREVER U</span>
        <strong>相册审阅</strong>
      </a>
      <div class="review-counter" id="editorCounter">000 / 000</div>
      <div class="review-tools">
        <button class="tool-btn" id="btnOpenUpload" type="button">＋ 上传照片</button>
        <button class="tool-btn" id="btnOpenAuth" type="button">GitHub 连接</button>
      </div>
    </header>

    <section class="review-stage" id="photoEditor" hidden>
      <div class="review-loader" id="reviewLoader">正在读取相册…</div>
      <img id="editorImage" class="review-image" alt="当前照片" draggable="false" />
      <button class="stage-nav stage-prev" id="btnPrevPhoto" type="button" aria-label="上一张">‹</button>
      <button class="stage-nav stage-next" id="btnNextPhoto" type="button" aria-label="下一张">›</button>
    </section>

    <section class="review-empty" id="reviewEmpty" hidden>相册里还没有照片</section>

    <footer class="review-footer">
      <div class="review-fields">
        <label class="field-name">
          <span>文件名</span>
          <input id="editorName" type="text" placeholder="照片名称.jpg" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field-date">
          <span>日期</span>
          <input id="editorDate" type="text" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" placeholder="YYYYMMDD" autocomplete="off" />
        </label>
        <label class="field-caption">
          <span>文案（可选）</span>
          <input id="editorCaption" type="text" placeholder="这张照片的故事…" autocomplete="off" />
        </label>
        <span id="editorFilename" class="source-path"></span>
      </div>
      <div class="review-actions">
        <span id="editorStatus" class="review-status"></span>
        <button class="trash-btn" id="btnTrashCurrent" type="button">移入回收站</button>
        <button class="save-btn" id="btnSaveCurrent" type="button">保存</button>
      </div>
      <div class="review-shortcuts">
        <span><kbd>←</kbd><kbd>→</kbd> 切换</span>
        <span><kbd>F2</kbd> 改名</span>
        <span><kbd>Del</kbd> 回收站</span>
        <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销</span>
        <span><kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</span>
      </div>
    </footer>
  </main>

  <section class="review-modal" id="authModal" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <div><small>保存前需要</small><h2>连接 GitHub</h2></div>
        <button class="modal-close" id="btnCloseAuth" type="button" aria-label="关闭">×</button>
      </div>
      <div class="form-grid">
        <label>用户名<input id="inOwner" placeholder="featherblade91" /></label>
        <label>仓库名<input id="inRepo" placeholder="featherblade91.github.io" /></label>
        <label>分支<input id="inBranch" placeholder="master" /></label>
        <label class="span-all">GitHub Token
          <input id="inToken" type="password" placeholder="Fine-grained Token（Contents 读写）" autocomplete="off" />
        </label>
      </div>
      <label class="remember-token"><input type="checkbox" id="chkSaveToken" /> 仅在此浏览器保存 Token</label>
      <div class="modal-actions">
        <span id="tokenStatus" class="review-status"></span>
        <button class="save-btn" id="btnConnect" type="button">连接</button>
      </div>
    </div>
  </section>

  <section class="review-modal" id="uploadCard" hidden>
    <div class="modal-panel upload-panel">
      <div class="modal-head">
        <div><small>ADD MEMORIES</small><h2>上传新照片</h2></div>
        <button class="modal-close" id="btnCloseUpload" type="button" aria-label="关闭">×</button>
      </div>
      <label class="drop-zone" id="dropZone">
        <input type="file" id="inFiles" accept="image/*" multiple hidden />
        <span class="dz-icon">＋</span>
        <span>点击选择或拖拽照片到这里</span>
      </label>
      <div id="previewList" class="preview-list"></div>
      <div class="modal-actions">
        <button class="save-btn" id="btnUpload" type="button" disabled>上传并同步</button>
      </div>
    </div>
  </section>

  <section class="log-drawer" id="logCard" hidden>
    <pre id="log" class="log"></pre>
  </section>

  <div id="photoList" hidden></div>
  <button id="btnSaveManifest" type="button" hidden></button>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
