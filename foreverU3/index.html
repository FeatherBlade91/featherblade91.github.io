<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LYK ♥ DMY · 我们的恋爱相册</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>" />
  <link rel="preload" href="fonts/cormorantgaramond-600i-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css?v=20261125" />
  <link rel="stylesheet" href="css/style.css?v=20261125-wall-year" />
  <link rel="stylesheet" href="css/chat.css?v=20261125" />
  <link rel="stylesheet" href="css/questions.css?v=20260925" />
</head>
<body>

  <!-- ===== 背景层 ===== -->
  <div class="bg-gradient"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div id="bubbles" class="bubbles" aria-hidden="true"></div>
  <canvas id="starlight" aria-hidden="true"></canvas>

  <!-- ===== 悬浮控件 ===== -->
  <button id="musicToggle" class="float-btn music-btn" title="展开音乐播放器" aria-label="展开音乐播放器"
          aria-controls="musicPlayer" aria-expanded="false">
    <span class="music-note">♪</span>
  </button>
  <section class="music-player" id="musicPlayer" aria-label="音乐播放器" aria-hidden="true">
    <div class="music-heading">
      <div class="music-disc" aria-hidden="true"><span>♪</span></div>
      <div class="music-meta">
        <span class="music-kicker" id="musicPosition">01 / 05</span>
        <strong class="music-title" id="musicTitle">Lost Stars</strong>
        <span class="music-artist" id="musicArtist">Adam Levine</span>
      </div>
    </div>
    <div class="music-timeline">
      <input class="music-progress" id="musicProgress" type="range" min="0" max="1000" value="0"
             aria-label="播放进度" />
      <div class="music-times" aria-hidden="true">
        <time id="musicCurrent">0:00</time>
        <time id="musicDuration">0:00</time>
      </div>
    </div>
    <div class="music-controls">
      <button class="music-control" id="musicPrev" type="button" aria-label="上一首" title="上一首">‹</button>
      <button class="music-control music-play" id="musicPlay" type="button" aria-label="播放" title="播放">▶</button>
      <button class="music-control" id="musicNext" type="button" aria-label="下一首" title="下一首">›</button>
    </div>
  </section>
  <a class="float-btn admin-btn" href="admin.html" title="管理相册">✎</a>
  <button id="settingsToggle" class="float-btn settings-btn" title="设置" aria-label="设置">⚙</button>

  <!-- ===== 模式导航 ===== -->
  <nav class="mode-nav" id="modeNav">
    <button class="nav-pill active" data-mode="home"><span class="nav-zh">首页</span><span class="nav-en">Home</span></button>
    <button class="nav-pill" data-mode="ring"><span class="nav-zh">3D 相册</span><span class="nav-en">Ring</span></button>
    <button class="nav-pill" data-mode="galaxy"><span class="nav-zh">星河漫游</span><span class="nav-en">Orbit</span></button>
    <button class="nav-pill" data-mode="slideshow"><span class="nav-zh">幻灯片</span><span class="nav-en">Film</span></button>
    <button class="nav-pill" data-mode="wishes"><span class="nav-zh">心愿清单</span><span class="nav-en">Wishes</span></button>
  </nav>

  <main id="app">

    <!-- ===== 首页 ===== -->
    <section class="mode-page active" id="page-home">
      <!-- 封面：名字 + 计时卡居中，宽屏两侧钉几张随手翻到的拍立得（PhotoWall.buildCover） -->
      <div class="home-cover">
        <div class="cover-scatter" id="coverScatter"></div>
        <div class="hero">
          <div class="hero-badge">✦ Our Love Story ✦</div>
          <h1 class="hero-names">
            <span class="name name-him">LYK</span>
            <span class="hero-heart" id="heroHeart">
              <svg viewBox="0 0 100 92" width="1em" height="0.92em" aria-hidden="true">
                <defs>
                  <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#7fb8ec"/>
                    <stop offset="0.5" stop-color="#b7a6e8"/>
                    <stop offset="1" stop-color="#ffa6c6"/>
                  </linearGradient>
                </defs>
                <path fill="url(#heartGrad)" d="M50 84 C22 62 4 44 4 26 C4 11 15 3 27 3 C37 3 45 9 50 18 C55 9 63 3 73 3 C85 3 96 11 96 26 C96 44 78 62 50 84 Z"/>
                <path class="ecg" pathLength="100" d="M13 40 H33 L39 28 L47 53 L53 33 L57 40 H87"/>
                <ellipse cx="32" cy="22" rx="10" ry="6" fill="#ffffff" opacity="0.55" transform="rotate(-20 32 22)"/>
              </svg>
            </span>
            <span class="name name-her">DMY</span>
          </h1>
          <p class="hero-subtitle" id="heroSubtitle"></p>

          <div class="timer-wrap">
            <div class="timer-card glass">
              <div class="timer-label">我们已经在一起</div>
              <div class="timer-grid" id="loveTimer"></div>
              <button class="timer-switch" id="timerSwitch" title="切换计时方式"></button>
            </div>
          </div>

          <p class="hero-milestone" id="heroMilestone" hidden></p>

        </div>
        <button class="scroll-hint" id="toWall" type="button">往下翻，是我们的照片墙<span aria-hidden="true">↓</span></button>
      </div>

      <!-- 照片墙：按月份分组的拍立得，点照片看大图，点 ♡ 收进「心动」（逻辑在 PhotoWall） -->
      <div class="wall" id="wall">
        <header class="wall-head">
          <div class="hero-badge">✦ Photo Wall ✦</div>
          <h2 class="wall-title">我们的照片墙</h2>
          <p class="wall-sub" id="wallSub"></p>
        </header>
        <div class="wall-tools">
          <nav class="wall-time" id="wallTime" aria-label="按年份和月份浏览照片">
            <div class="wall-years">
              <button type="button" class="wall-year-step" id="wallNewer" aria-label="切换到较新的年份" title="较新的年份">‹</button>
              <strong id="wallYear" aria-live="polite"></strong>
              <button type="button" class="wall-year-step" id="wallOlder" aria-label="切换到较早的年份" title="较早的年份">›</button>
            </div>
            <div class="wall-months" id="wallMonths"></div>
          </nav>
          <button class="wall-loved" id="wallLoved" type="button" aria-pressed="false">
            <svg viewBox="0 0 100 92" aria-hidden="true"><path d="M50 84 C22 62 4 44 4 26 C4 11 15 3 27 3 C37 3 45 9 50 18 C55 9 63 3 73 3 C85 3 96 11 96 26 C96 44 78 62 50 84 Z"/></svg>
            只看心动 <span class="wall-loved-n" id="wallLovedN">0</span>
          </button>
        </div>
        <div id="wallBody"></div>
        <p class="wall-empty" id="wallEmpty" hidden>还没有心动的照片。点照片右下角的 ♡，喜欢的那张就会留在这里。</p>
      </div>
      <!-- 悄悄话入口故意做得不起眼：左下角一个淡淡的小信封 -->
      <button id="openLetter" class="secret-letter" title="" aria-label="悄悄话">💌</button>
    </section>

    <!-- ===== 3D 旋转相册 ===== -->
    <section class="mode-page" id="page-ring">
      <div class="ring-stage" id="ringStage">
        <div class="ring" id="ring"></div>
        <div class="ring-floor"></div>
        <div class="ring-now" id="ringNow"></div>
        <div class="ring-hint">左右拨动 · 上下拖动换视角 · 滚轮/双指推拉 · 点照片看大图</div>
      </div>
    </section>

    <!-- ===== 星河漫游 ===== -->
    <section class="mode-page" id="page-galaxy">
      <div class="galaxy-stage" id="galaxyStage">
        <div class="galaxy-space" id="galaxySpace"></div>
        <div class="galaxy-vignette"></div>
        <div class="galaxy-views">
          <button data-view="far" title="拉远一点，看整条照片光环">🪐 远景</button>
          <button data-view="ring" title="贴着环面，看照片列队掠过">💍 环面</button>
          <button data-view="near" title="凑近一点，照片从身边飞过">🔭 近观</button>
        </div>
        <div class="galaxy-hint">左右拨动星环 · 上下拖动换视角 · 滚轮/双指推拉远近 · 点击照片看大图</div>
      </div>
    </section>

    <!-- ===== 幻灯片 ===== -->
    <section class="mode-page" id="page-slideshow">
      <div class="slide-box" id="slideBox">
        <div class="slide-layer" id="slideA"></div>
        <div class="slide-layer" id="slideB"></div>
        <!-- 顶部 2px 进度发丝，与自动播放同周期（时长在 Slideshow.DUR） -->
        <div class="slide-progress"><span class="slide-progress-bar" id="slideBar"></span></div>
        <div class="slide-caption" id="slideCaption">
          <span class="slide-cap-title" id="slideCapTitle"></span>
          <span class="slide-cap-date" id="slideCapDate"></span>
        </div>
        <div class="slide-controls">
          <button class="slide-btn" id="slidePrev">‹</button>
          <button class="slide-btn" id="slidePlay">⏸</button>
          <button class="slide-btn" id="slideNext">›</button>
        </div>
        <!-- 胶片计数器（03 / 151）：照片多了放不下圆点，用计数器替代 -->
        <div class="slide-counter" id="slideCounter"></div>
      </div>
    </section>

    <!-- ===== 心愿清单：一起想做的事，做完就打卡（逻辑在 js/wishes.js） ===== -->
    <section class="mode-page" id="page-wishes">
      <div class="wish-wrap">
        <header class="wish-head">
          <div class="hero-badge">✦ Wish List ✦</div>
          <h2 class="wish-title">想和你一起做的事</h2>
          <p class="wish-progress" id="wishProgress"></p>
        </header>
        <div class="wish-toolbar">
          <div class="wish-filters" role="tablist" aria-label="筛选心愿">
            <button type="button" role="tab" data-filter="all" aria-selected="true">全部</button>
            <button type="button" role="tab" data-filter="todo" aria-selected="false">还想做</button>
            <button type="button" role="tab" data-filter="done" aria-selected="false">已完成</button>
          </div>
          <button type="button" class="wish-add" id="wishAdd">＋ 许个心愿</button>
        </div>
        <p class="wish-notice" id="wishNotice" role="status"></p>
        <ol class="wish-list" id="wishList" aria-live="polite"></ol>
        <p class="wish-empty" id="wishEmpty" hidden></p>
      </div>
    </section>

    <!-- 时间轴暂时下线：照片时间尚未标注，恢复时把下面的导航和本区块加回即可 -->

  </main>

  <!-- ===== 本页设置弹窗（右上角 ⚙，各子页面内容不同，见 main.js 的 ModeSettings） ===== -->
  <div class="settings-pop" id="settingsPop">
    <div class="settings-head">
      <span class="settings-title" id="settingsTitle"></span>
      <button class="settings-close" id="settingsClose" aria-label="关闭设置">✕</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
    <button class="settings-reset" id="settingsReset">↺ 重置为默认值</button>
  </div>

  <!-- ===== 照片灯箱 ===== -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose">✕</button>
    <button class="lb-arrow lb-prev" id="lbPrev">‹</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="" />
      <figcaption class="lb-caption" id="lbCaption"></figcaption>
    </figure>
    <button class="lb-arrow lb-next" id="lbNext">›</button>
  </div>

  <!-- ===== 悄悄话弹窗 ===== -->
  <div class="letter-modal" id="letterModal">
    <div class="petals" id="petals"></div>
    <div class="letter-card">
      <button class="letter-close" id="letterClose">✕</button>
      <div class="letter-seal">❤</div>
      <h3 class="letter-title" id="letterTitle"></h3>
      <div class="letter-body" id="letterBody"></div>
    </div>
  </div>

  <!-- 二人对话：不离开相册，也能说说今天。 -->
  <button class="chat-launch" id="chatToggle" type="button" aria-label="打开二人对话" aria-haspopup="dialog" aria-controls="chatDialog" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-4 3v-10A7.5 7.5 0 0 1 9.5 4h3A7.5 7.5 0 0 1 20 11.5Z"/><path d="M7 10h8M7 14h5"/></svg>
    <span class="chat-badge" id="chatBadge" hidden></span>
  </button>
  <dialog class="chat-dialog" id="chatDialog" aria-labelledby="chatTitle">
    <div class="chat-shell">
      <header class="chat-header">
        <h2 id="chatTitle">对话</h2>
        <span class="chat-status" id="chatStatus" role="status"></span>
        <button class="chat-icon" id="chatClose" type="button" aria-label="关闭">✕</button>
      </header>
      <div class="chat-login" id="chatLogin">
        <p class="chat-login-lead">登录后就能开始对话。</p>
        <p class="chat-error" id="chatLoginError" role="alert"></p>
        <button class="chat-primary" id="chatLoginButton" type="button">登录</button>
      </div>
      <section class="chat-conversation" id="chatConversation" aria-label="聊天内容" hidden>
        <div class="chat-scroll" id="chatScroll" tabindex="0" aria-label="消息记录">
          <button class="chat-history chat-text-btn" id="chatHistory" type="button" hidden>更早的消息</button>
          <div class="chat-empty" id="chatEmpty"></div>
          <div id="chatMessages" role="log" aria-label="对话消息" aria-live="polite" aria-relevant="additions"></div>
        </div>
        <button class="chat-new chat-text-btn" id="chatNew" type="button" hidden>新消息 ↓</button>
        <p class="chat-error chat-sync-error" id="chatSyncError" role="alert"></p>
        <form class="chat-compose" id="chatCompose">
          <label class="chat-sr-only" for="chatInput">输入消息</label>
          <textarea id="chatInput" rows="1" maxlength="2000" enterkeyhint="enter"></textarea>
          <span class="chat-counter" id="chatCounter"></span>
          <button class="chat-send" id="chatSend" type="submit" disabled>发送</button>
        </form>
      </section>
    </div>
  </dialog>
  <script src="js/config.js"></script>
  <script src="js/music.js?v=20260825"></script>
  <script src="js/main.js?v=20261125-wall-year"></script>
  <script defer src="js/vendor/supabase-2.117.1.js"></script>
  <script defer src="js/chat-config.js?v=5244cf04"></script>
  <link rel="stylesheet" href="css/auth.css?v=20261125" />
  <script defer src="js/auth.js?v=20261125"></script>
  <script defer src="js/questions.js?v=20260925"></script>
  <script defer src="js/chat.js?v=20261125b"></script>
  <link rel="stylesheet" href="css/upload.css?v=20260925" />
  <script defer src="js/upload.js?v=20261125"></script>
  <link rel="stylesheet" href="css/wishes.css?v=20261125" />
  <script defer src="js/wishes.js?v=20261125b"></script>
</body>
</html>
